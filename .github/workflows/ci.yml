name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref to save time and reduce noise.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (JDK ${{ matrix.jdk }})
    runs-on: ubuntu-latest
    strategy:
      # Collect every supported JDK's result even if another matrix job fails.
      fail-fast: false
      matrix:
        jdk: ['21', '25']
    steps:
      - name: Check out soklet-servlet-javax
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: soklet-servlet-javax
          persist-credentials: false

      - name: Verify pinned Javadoc indexes
        run: node soklet-servlet-javax/scripts/verify-javadoc-links.mjs

      - name: Install checksum-pinned JDK 26 for documentation
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/amazon-corretto-26.0.2.11.1-linux-x64.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            https://corretto.aws/downloads/resources/26.0.2.11.1/amazon-corretto-26.0.2.11.1-linux-x64.tar.gz \
            --output "$archive"
          printf 'f61206891b8e1009b117eefe38784cf31b0a5cdb02fd2e023556f436b85dedaa  %s\n' "$archive" \
            | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          docs_home="${RUNNER_TEMP}/amazon-corretto-26.0.2.11.1-linux-x64"
          test "$("$docs_home/bin/javadoc" --version)" = 'javadoc 26.0.2.1'
          printf 'SOKLET_JAVADOC_HOME=%s\n' "$docs_home" >> "$GITHUB_ENV"

      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: corretto
          java-version: ${{ matrix.jdk }}
          cache: maven

      - name: Resolve core Javadoc from the POM dependency
        shell: bash
        run: |
          mvn -B -ntp -f soklet-servlet-javax/pom.xml \
            org.apache.maven.plugins:maven-dependency-plugin:3.11.0:unpack-dependencies \
            -DincludeGroupIds=com.soklet -DincludeArtifactIds=soklet \
            -DexcludeTransitive=true -Dclassifier=javadoc \
            -Dmdep.failOnMissingClassifierArtifact=true \
            -DoutputDirectory="${RUNNER_TEMP}/core-javadoc"
          test -f "${RUNNER_TEMP}/core-javadoc/element-list"

      - name: Verify adapter and packaged Javadoc
        run: >-
          mvn -B -ntp -f soklet-servlet-javax/pom.xml -Dgpg.skip=true
          -Dsoklet.javadoc.location="${RUNNER_TEMP}/core-javadoc" clean verify
